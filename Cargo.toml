[package]
name = "vtcode-hex-editor"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A file-backed hexadecimal editor for VTCode"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
vtcode-extension-api = { path = "vendor/vtcode-extension-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
